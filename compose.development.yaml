name: vocab-learn-dev

x-development: &development
  image: vocab-learn:dev
  environment:
    DJANGO_DEBUG: "1"
    DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    DJANGO_CSRF_TRUSTED_ORIGINS: http://127.0.0.1:8766,http://localhost:8766
    TRUST_PROXY: "0"

services:
  migrate:
    <<: *development
  web:
    <<: *development
    ports:
      - "127.0.0.1:8766:8000"
  worker:
    <<: *development
  caddy:
    profiles: [private-https]
    ports: !reset []
