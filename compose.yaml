name: vocab-learn
x-app: &app
  image: vocab-learn:v1
  build: .
  init: true
  env_file: .env
  environment: &environment
    DJANGO_DEBUG: "0"
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
    DJANGO_ALLOWED_HOSTS: ${APP_HOSTNAME:-vocab.home.arpa},localhost,127.0.0.1
    DJANGO_CSRF_TRUSTED_ORIGINS: ${APP_ORIGIN:-https://vocab.home.arpa}
    TRUST_PROXY: "1"
    APP_DATA_DIR: /data
    AUDIO_DIR: /audio
    NO_PROXY: ${NO_PROXY_DESTINATIONS:-localhost,127.0.0.1,web,caddy}
    no_proxy: ${NO_PROXY_DESTINATIONS:-localhost,127.0.0.1,web,caddy}
    MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
    AUDIO_ASSESS_PROVIDER: ${AUDIO_ASSESS_PROVIDER:-qwen}
    AUDIO_ASSESS_API_MODE: ${AUDIO_ASSESS_API_MODE:-chat_completions}
    AUDIO_ASSESS_ENDPOINT: ${AUDIO_ASSESS_ENDPOINT:-}
    AUDIO_ASSESS_MODEL: ${AUDIO_ASSESS_MODEL:-}
    AUDIO_ASSESS_API_KEY: ${AUDIO_ASSESS_API_KEY:-}
    AUDIO_ASSESS_TIMEOUT_SECONDS: ${AUDIO_ASSESS_TIMEOUT_SECONDS:-60}
    AUDIO_ASSESS_MAX_COMPLETION_TOKENS: ${AUDIO_ASSESS_MAX_COMPLETION_TOKENS:-8192}
    GENERATOR_ENDPOINT: ${GENERATOR_ENDPOINT:-https://open.bigmodel.cn/api/coding/paas/v4/chat/completions}
    GENERATOR_MODEL: ${GENERATOR_MODEL:-glm-5.3-flash}
    GENERATOR_PROTOCOL: ${GENERATOR_PROTOCOL:-zhipu}
    GENERATOR_API_KEY: ${GENERATOR_API_KEY:-}
    GENERATOR_THINKING: ${GENERATOR_THINKING:-enabled}
    GENERATOR_REASONING_EFFORT: ${GENERATOR_REASONING_EFFORT:-max}
    GENERATOR_TIMEOUT_SECONDS: ${GENERATOR_TIMEOUT_SECONDS:-120}
    GENERATOR_MAX_COMPLETION_TOKENS: ${GENERATOR_MAX_COMPLETION_TOKENS:-8192}
    EXAMPLE_REVIEWER_ENDPOINT: ${EXAMPLE_REVIEWER_ENDPOINT:-https://api.minimax.cn/v1/chat/completions}
    EXAMPLE_REVIEWER_MODEL: ${EXAMPLE_REVIEWER_MODEL:-MiniMax-M3.1-Flash}
    EXAMPLE_REVIEWER_PROTOCOL: ${EXAMPLE_REVIEWER_PROTOCOL:-minimax}
    EXAMPLE_REVIEWER_API_KEY: ${EXAMPLE_REVIEWER_API_KEY:-}
    EXAMPLE_REVIEWER_THINKING: ${EXAMPLE_REVIEWER_THINKING:-adaptive}
    EXAMPLE_REVIEWER_REASONING_EFFORT: ${EXAMPLE_REVIEWER_REASONING_EFFORT:-max}
    EXAMPLE_REVIEWER_TIMEOUT_SECONDS: ${EXAMPLE_REVIEWER_TIMEOUT_SECONDS:-120}
    EXAMPLE_REVIEWER_MAX_COMPLETION_TOKENS: ${EXAMPLE_REVIEWER_MAX_COMPLETION_TOKENS:-8192}
    DEFINITION_ENDPOINT: ${DEFINITION_ENDPOINT:-https://api.minimax.cn/v1/chat/completions}
    DEFINITION_MODEL: ${DEFINITION_MODEL:-MiniMax-M3.1-Flash}
    DEFINITION_API_KEY: ${DEFINITION_API_KEY:-}
    DEFINITION_TIMEOUT_SECONDS: ${DEFINITION_TIMEOUT_SECONDS:-120}
    DEFINITION_MAX_COMPLETION_TOKENS: ${DEFINITION_MAX_COMPLETION_TOKENS:-8192}
    SPEECH_ENDPOINT: ${SPEECH_ENDPOINT:-https://api.minimax.cn/v1/t2a_v2}
    SPEECH_MODEL: ${SPEECH_MODEL:-speech-2.8-turbo}
    SPEECH_API_KEY: ${SPEECH_API_KEY:-}
    SPEECH_TIMEOUT_SECONDS: ${SPEECH_TIMEOUT_SECONDS:-120}
    SPEECH_VOICE_ENGLISH: ${SPEECH_VOICE_ENGLISH:-}
    SPEECH_VOICE_SPANISH: ${SPEECH_VOICE_SPANISH:-}
    SPEECH_VOICE_MANDARIN: ${SPEECH_VOICE_MANDARIN:-}
    ILLUSTRATION_ENDPOINT: ${ILLUSTRATION_ENDPOINT:-}
    ILLUSTRATION_MODEL: ${ILLUSTRATION_MODEL:-}
    ILLUSTRATION_API_KEY: ${ILLUSTRATION_API_KEY:-}
    ILLUSTRATION_TIMEOUT_SECONDS: ${ILLUSTRATION_TIMEOUT_SECONDS:-300}
    ILLUSTRATION_CAPTION_ENDPOINT: ${ILLUSTRATION_CAPTION_ENDPOINT:-https://api.minimax.cn/v1/chat/completions}
    ILLUSTRATION_CAPTION_MODEL: ${ILLUSTRATION_CAPTION_MODEL:-MiniMax-M3.1-Flash}
    ILLUSTRATION_CAPTION_API_KEY: ${ILLUSTRATION_CAPTION_API_KEY:-}
  volumes:
    - app_data:/data
    - audio_tmp:/audio
  stop_grace_period: 15s

services:
  migrate:
    <<: *app
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"
  web:
    <<: *app
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client; c=http.client.HTTPConnection('127.0.0.1',8000,timeout=5); c.request('GET','/health/'); assert c.getresponse().status==200"]
      interval: 15s
      timeout: 6s
      retries: 5
    mem_limit: 768m
  worker:
    <<: *app
    command: ["sh", "-c", "cat /etc/ssl/certs/ca-certificates.crt /usr/local/share/ca-certificates/renderer-ca.crt > /tmp/worker-trust.pem 2>/dev/null || cp /etc/ssl/certs/ca-certificates.crt /tmp/worker-trust.pem; export SSL_CERT_FILE=/tmp/worker-trust.pem; exec python manage.py runworker"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 1g
    volumes:
      - app_data:/data
      - audio_tmp:/audio
      # Optional private CA for TLS-verified self-hosted providers (such as the illustration
      # renderer); unset leaves the container trust store untouched.
      - ${RENDERER_CA_FILE:-./var/renderer-ca.optional.crt}:/usr/local/share/ca-certificates/renderer-ca.crt:ro
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      APP_HOSTNAME: ${APP_HOSTNAME:-vocab.home.arpa}
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      NO_PROXY: "*"
      no_proxy: "*"
    ports:
      - "${LAN_BIND_IP:?Set LAN_BIND_IP}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  app_data:
  audio_tmp:
  caddy_data:
  caddy_config:
